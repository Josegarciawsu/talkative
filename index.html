<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocabulario 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07090c;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 50% 18%, rgba(122, 155, 118, 0.18), transparent 34%),
        radial-gradient(circle at 20% 80%, rgba(201, 137, 98, 0.14), transparent 34%),
        linear-gradient(180deg, #0b0f12, #040506 70%);
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    canvas.webgl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #floatingWord {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #f4ead2;
      font-weight: 800;
      font-size: clamp(28px, 5vw, 74px);
      letter-spacing: 0.03em;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      filter: blur(10px);
      text-shadow:
        0 0 12px rgba(244, 234, 210, 0.45),
        0 0 34px rgba(122, 155, 118, 0.35),
        0 0 70px rgba(183, 247, 210, 0.18);
      transition:
        opacity 0.65s ease,
        filter 0.65s ease,
        transform 0.09s linear,
        color 0.5s ease;
      z-index: 4;
      max-width: 92vw;
      white-space: normal;
      line-height: 1.05;
    }

    #floatingWord.visible {
      opacity: 1;
      filter: blur(0);
    }

    #floatingWord.english {
      color: #effff7;
      text-shadow:
        0 0 12px rgba(239, 255, 247, 0.7),
        0 0 36px rgba(183, 247, 210, 0.45),
        0 0 90px rgba(183, 247, 210, 0.22);
    }

    #floatingWord.behind {
      opacity: 0.55;
      filter: blur(1.5px);
    }

    #hint {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      color: rgba(245, 238, 220, 0.78);
      letter-spacing: 0.16em;
      font-size: 12px;
      text-transform: uppercase;
      white-space: nowrap;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.045);
      backdrop-filter: blur(16px);
    }

    #panMeter {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(245, 238, 220, 0.72);
      font-size: 12px;
      letter-spacing: 0.15em;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
    }

    #track {
      width: min(42vw, 270px);
      height: 4px;
      position: relative;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        rgba(122, 155, 118, 0.25),
        rgba(244, 231, 204, 0.45),
        rgba(201, 137, 98, 0.25)
      );
    }

    #panDot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: #b7f7d2;
      box-shadow: 0 0 18px #b7f7d2, 0 0 36px rgba(183, 247, 210, 0.55);
      transition: left 0.1s linear;
    }

    #matrixCanvas {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #matrixCanvas.on {
      opacity: 1;
    }

    #splash {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(122, 155, 118, 0.16), rgba(8, 11, 14, 0.94) 55%, #020303 100%);
    }

    #splash::before,
    #splash::after {
      content: "";
      position: absolute;
      inset: -20%;
      background-image:
        radial-gradient(circle, rgba(201, 137, 98, 0.52) 0 1px, transparent 2px),
        radial-gradient(circle, rgba(122, 155, 118, 0.45) 0 1px, transparent 2px),
        radial-gradient(circle, rgba(244, 231, 204, 0.35) 0 1px, transparent 2px);
      background-size: 130px 130px, 180px 180px, 230px 230px;
      animation: drift 18s linear infinite;
      opacity: 0.45;
    }

    #splash::after {
      animation-duration: 26s;
      animation-direction: reverse;
      opacity: 0.3;
    }

    #splashCard {
      position: relative;
      z-index: 2;
      width: min(92vw, 700px);
      padding: 54px 34px;
      text-align: center;
      border-radius: 34px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.035));
      backdrop-filter: blur(28px);
      box-shadow:
        0 35px 100px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    #eyebrow {
      margin: 0 0 16px;
      color: #7a9b76;
      letter-spacing: 0.38em;
      font-size: 12px;
    }

    h1 {
      margin: 0;
      color: #f7f1e5;
      font-size: clamp(42px, 8vw, 82px);
      letter-spacing: 0.18em;
      text-shadow: 0 0 34px rgba(244, 231, 204, 0.28);
    }

    #subtitle {
      color: rgba(244, 231, 204, 0.82);
      font-size: clamp(16px, 2.2vw, 22px);
      margin: 20px 0 34px;
      letter-spacing: 0.08em;
    }

    #startBtn {
      appearance: none;
      border: 1px solid rgba(201, 137, 98, 0.72);
      background: rgba(201, 137, 98, 0.08);
      color: #f4e7cc;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.2em;
      border-radius: 999px;
      padding: 16px 32px;
      cursor: pointer;
      box-shadow:
        0 0 30px rgba(201, 137, 98, 0.16),
        inset 0 0 20px rgba(255, 255, 255, 0.03);
      transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    #startBtn:hover {
      transform: translateY(-2px) scale(1.02);
      background: rgba(201, 137, 98, 0.16);
      box-shadow: 0 0 46px rgba(201, 137, 98, 0.28);
    }

    #splash.hidden {
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    @keyframes drift {
      to {
        transform: translate3d(90px, 140px, 0);
      }
    }

    @media (max-width: 650px) {
      #hint {
        top: 14px;
        font-size: 10px;
        padding: 8px 12px;
      }

      h1 {
        letter-spacing: 0.1em;
      }

      #splashCard {
        padding: 42px 22px;
        border-radius: 26px;
      }

      #panMeter {
        bottom: 16px;
      }

      #track {
        width: 58vw;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <canvas id="webgl" class="webgl"></canvas>
    <canvas id="matrixCanvas"></canvas>

    <div id="hint">Sigue el punto · Usa audífonos</div>
    <div id="floatingWord"></div>

    <div id="panMeter">
      <span>L</span>
      <div id="track"><i id="panDot"></i></div>
      <span>R</span>
    </div>

    <div id="splash">
      <div id="splashCard">
        <p id="eyebrow">SPATIAL LEARNING</p>
        <h1>VOCABULARIO 3D</h1>
        <p id="subtitle">Sigue el punto · Usa audífonos</p>
        <button id="startBtn">▶ INICIAR</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

  <script>
    const VOCABULARY = [
      { en: "Yield", es: "ceder el paso" },
      { en: "Lane", es: "carril" },
      { en: "Crosswalk", es: "cruce peatonal" },
      { en: "Pedestrian", es: "peatón" },
      { en: "Shoulder", es: "acotamiento" },
      { en: "Headlights", es: "faros" },
      { en: "Taillights", es: "luces traseras" },
      { en: "Windshield", es: "parabrisas" },
      { en: "Seatbelt", es: "cinturón de seguridad" },
      { en: "Brake", es: "freno" },
      { en: "Steering wheel", es: "volante" },
      { en: "Speed limit", es: "límite de velocidad" },
      { en: "Merge", es: "incorporarse" },
      { en: "Pass", es: "rebasar" },
      { en: "Detour", es: "desvío" },
      { en: "Slippery", es: "resbaloso" },
      { en: "Skid", es: "derrape" },
      { en: "Tailgating", es: "seguir muy de cerca" },
      { en: "Honk", es: "tocar el claxon" },
      { en: "Bumper", es: "defensa" },
      { en: "Hood", es: "cofre" },
      { en: "Trunk", es: "cajuela" },
      { en: "Wiper", es: "limpiaparabrisas" },
      { en: "Rearview mirror", es: "espejo retrovisor" },
      { en: "Blind spot", es: "punto ciego" },
      { en: "Curb", es: "banqueta" },
      { en: "Intersection", es: "intersección" },
      { en: "Four-way stop", es: "alto de cuatro vías" },
      { en: "Freeway", es: "autopista" },
      { en: "Ramp", es: "rampa" },
      { en: "Reckless", es: "imprudente" },
      { en: "Drowsy", es: "somnoliento" },
      { en: "Swerve", es: "virar bruscamente" },
      { en: "Stall", es: "apagarse el motor" },
      { en: "Tread", es: "dibujo de la llanta" },
      { en: "Blowout", es: "reventón de llanta" },
      { en: "School zone", es: "zona escolar" },
      { en: "Work zone", es: "zona de construcción" },
      { en: "Railroad crossing", es: "cruce ferroviario" },
      { en: "Deer crossing", es: "cruce de venados" },
      { en: "Flashing lights", es: "luces intermitentes" },
      { en: "Right-of-way", es: "derecho de paso" },
      { en: "Pull over", es: "orillarse" },
      { en: "U-turn", es: "vuelta en U" },
      { en: "Back up", es: "retroceder" },
      { en: "Turn signal", es: "direccional" },
      { en: "License plate", es: "placa" },
      { en: "Ticket", es: "multa" },
      { en: "Tow truck", es: "grúa" },
      { en: "Crash", es: "choque" }
    ];

    const canvas = document.getElementById("webgl");
    const matrixCanvas = document.getElementById("matrixCanvas");
    const floatingWord = document.getElementById("floatingWord");
    const panDot = document.getElementById("panDot");
    const splash = document.getElementById("splash");
    const startBtn = document.getElementById("startBtn");

    let width = window.innerWidth;
    let height = window.innerHeight;
    let started = false;
    let audioEngine = null;
    let voices = [];
    let sequence = shuffle(VOCABULARY);
    let wordIndex = 0;
    let currentPhase = "idle";
    let currentWordVisible = false;
    let lastEnglishWord = "VOCAB";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07090c);
    scene.fog = new THREE.Fog(0x07090c, 4.7, 11.5);

    const camera = new THREE.PerspectiveCamera(48, width / height, 0.1, 100);
    camera.position.set(0, 1.45, 5.2);
    camera.lookAt(0, 1.15, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;

    const clock = new THREE.Clock();
    const pointerPosition = new THREE.Vector3(0, 1.5, 1.7);
    const pointerTarget = randomOrbitPoint();
    const projected = new THREE.Vector3();

    initScene();
    animate();

    startBtn.addEventListener("click", () => {
      started = true;
      initAudio();
      splash.classList.add("hidden");
      setTimeout(() => splash.style.display = "none", 950);
      runVocabularyLoop();
    });

    if ("speechSynthesis" in window) {
      const loadVoices = () => voices = window.speechSynthesis.getVoices();
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function initScene() {
      const ambient = new THREE.AmbientLight(0xffffff, 0.34);
      scene.add(ambient);

      const key = new THREE.DirectionalLight(0xf7f0dd, 1.35);
      key.position.set(3, 5, 4);
      key.castShadow = true;
      key.shadow.mapSize.width = 2048;
      key.shadow.mapSize.height = 2048;
      scene.add(key);

      const sageLight = new THREE.PointLight(0x7a9b76, 1.25, 7);
      sageLight.position.set(-2.5, 2.5, 2.3);
      scene.add(sageLight);

      const terracottaLight = new THREE.PointLight(0xc98962, 1.1, 6);
      terracottaLight.position.set(2.8, 2.2, -1.8);
      scene.add(terracottaLight);

      createRoom();
      createMannequin();
      createPointer();
      createParticles();
    }

    let headGroup;
    function createMannequin() {
      headGroup = new THREE.Group();
      headGroup.position.set(0, 0.04, 0);
      scene.add(headGroup);

      const material = new THREE.MeshPhysicalMaterial({
        color: 0xe7e8df,
        roughness: 0.34,
        metalness: 0.05,
        clearcoat: 0.75,
        clearcoatRoughness: 0.16,
        transparent: true,
        opacity: 0.96
      });

      const skull = new THREE.Mesh(new THREE.SphereGeometry(0.78, 64, 64), material);
      skull.position.set(0, 1.52, 0);
      skull.scale.set(0.74, 0.92, 0.68);
      skull.castShadow = true;
      headGroup.add(skull);

      const backSkull = new THREE.Mesh(new THREE.SphereGeometry(0.7, 48, 48), material);
      backSkull.position.set(0, 1.36, -0.58);
      backSkull.scale.set(0.34, 0.26, 0.18);
      backSkull.castShadow = true;
      headGroup.add(backSkull);

      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 32), material);
      nose.position.set(0, 1.48, 0.68);
      nose.scale.set(0.13, 0.2, 0.33);
      nose.castShadow = true;
      headGroup.add(nose);

      const jaw = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), material);
      jaw.position.set(0, 1.1, 0.21);
      jaw.scale.set(0.55, 0.25, 0.32);
      jaw.castShadow = true;
      headGroup.add(jaw);

      const earL = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), material);
      earL.position.set(-0.64, 1.5, 0.05);
      earL.scale.set(0.12, 0.27, 0.18);
      earL.castShadow = true;
      headGroup.add(earL);

      const earR = earL.clone();
      earR.position.x = 0.64;
      headGroup.add(earR);

      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.48, 1.05, 48), material);
      neck.position.set(0, 0.6, -0.02);
      neck.scale.set(0.8, 1, 0.7);
      neck.castShadow = true;
      neck.receiveShadow = true;
      headGroup.add(neck);

      const shoulders = new THREE.Mesh(new THREE.SphereGeometry(0.72, 48, 48), material);
      shoulders.position.set(0, -0.05, 0);
      shoulders.scale.set(1.68, 0.34, 0.58);
      shoulders.castShadow = true;
      shoulders.receiveShadow = true;
      headGroup.add(shoulders);

      const halo = new THREE.Mesh(
        new THREE.SphereGeometry(0.9, 48, 48),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.045, wireframe: true })
      );
      halo.position.set(0, 1.55, -0.02);
      halo.scale.set(1.05, 1.25, 1.05);
      headGroup.add(halo);
    }

    function createRoom() {
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x151817, roughness: 0.42, metalness: 0.34 });
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x101513, roughness: 0.56, metalness: 0.18 });
      const sideMat = new THREE.MeshStandardMaterial({ color: 0x0e1114, roughness: 0.5, metalness: 0.26 });

      const floor = new THREE.Mesh(new THREE.BoxGeometry(8, 0.08, 7), floorMat);
      floor.position.set(0, -0.52, 0);
      floor.receiveShadow = true;
      scene.add(floor);

      const back = new THREE.Mesh(new THREE.BoxGeometry(8, 5.2, 0.08), wallMat);
      back.position.set(0, 2.1, -3.15);
      back.receiveShadow = true;
      scene.add(back);

      const left = new THREE.Mesh(new THREE.BoxGeometry(0.08, 5.2, 7), sideMat);
      left.position.set(-4, 2.1, 0);
      left.receiveShadow = true;
      scene.add(left);

      const right = left.clone();
      right.position.x = 4;
      scene.add(right);

      const ceiling = new THREE.Mesh(new THREE.BoxGeometry(8, 0.08, 7), sideMat);
      ceiling.position.set(0, 4.7, 0);
      ceiling.receiveShadow = true;
      scene.add(ceiling);

      const lineMat1 = new THREE.MeshBasicMaterial({ color: 0x7a9b76, transparent: true, opacity: 0.42 });
      const line1 = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.035, 0.035), lineMat1);
      line1.position.set(0, 0.02, -3.06);
      scene.add(line1);

      const lineMat2 = new THREE.MeshBasicMaterial({ color: 0xd8c7a8, transparent: true, opacity: 0.25 });
      const line2 = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.025, 0.035), lineMat2);
      line2.position.set(0, 3.8, -3.055);
      scene.add(line2);
    }

    let pointerGroup;
    let pointerLight;
    function createPointer() {
      pointerGroup = new THREE.Group();
      scene.add(pointerGroup);

      const color = 0xb7f7d2;
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.095, 32, 32),
        new THREE.MeshBasicMaterial({ color })
      );
      pointerGroup.add(core);

      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(0.25, 32, 32),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.14 })
      );
      pointerGroup.add(glow);

      pointerLight = new THREE.PointLight(color, 1.8, 4.2);
      pointerGroup.add(pointerLight);
    }

    function createParticles() {
      const geometry = new THREE.BufferGeometry();
      const count = 300;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        positions[i * 3] = THREE.MathUtils.randFloatSpread(7.5);
        positions[i * 3 + 1] = THREE.MathUtils.randFloat(-0.3, 4.1);
        positions[i * 3 + 2] = THREE.MathUtils.randFloatSpread(6.5);
      }
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({
        color: 0xd8c7a8,
        size: 0.018,
        transparent: true,
        opacity: 0.42,
        depthWrite: false
      });
      const points = new THREE.Points(geometry, material);
      scene.add(points);
    }

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      if (headGroup && started) {
        const targetY = elapsed < 2.5 ? 0 : Math.PI;
        headGroup.rotation.y += (targetY - headGroup.rotation.y) * 0.025;
      }

      if (pointerGroup) {
        pointerPosition.lerp(pointerTarget, 0.026);
        pointerGroup.position.copy(pointerPosition);
        const scale = 1 + Math.sin(performance.now() * 0.006) * 0.12;
        pointerGroup.scale.setScalar(scale);
        updateSpatialAudio(pointerPosition);
        updateFloatingWordPosition(pointerPosition);
        updatePan(pointerPosition.x);
      }

      renderer.render(scene, camera);
    }

    function updateFloatingWordPosition(pos) {
      projected.copy(pos);
      projected.y += 0.34;
      projected.project(camera);

      const x = (projected.x * 0.5 + 0.5) * width;
      const y = (-projected.y * 0.5 + 0.5) * height;

      const clampedX = Math.max(20, Math.min(width - 20, x));
      const clampedY = Math.max(70, Math.min(height - 90, y));

      floatingWord.style.left = clampedX + "px";
      floatingWord.style.top = clampedY + "px";
      floatingWord.classList.toggle("behind", pos.z < -0.25 && currentWordVisible);
    }

    function updatePan(x) {
      const pan = THREE.MathUtils.clamp(x / 3.2, -1, 1);
      panDot.style.left = `${50 + pan * 45}%`;
    }

    function randomOrbitPoint(radius = 2.25) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(THREE.MathUtils.randFloatSpread(1.65));
      const x = radius * Math.sin(phi) * Math.cos(theta);
      const y = THREE.MathUtils.clamp(radius * Math.cos(phi) + 0.85, -0.3, 3.05);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      return new THREE.Vector3(
        THREE.MathUtils.clamp(x, -3.25, 3.25),
        THREE.MathUtils.clamp(y, -0.2, 3.05),
        THREE.MathUtils.clamp(z, -2.75, 2.25)
      );
    }

    function shuffle(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function runVocabularyLoop() {
      await wait(3100);

      while (started) {
        const item = sequence[wordIndex % sequence.length];
        wordIndex++;

        pointerTarget.copy(randomOrbitPoint());
        spatialBlip(560 + Math.random() * 260, 0.45);
        await wait(1850);

        currentPhase = "spanish";
        showFloatingWord(item.es, "spanish");
        await wait(3000);
        hideFloatingWord();
        await wait(520);

        currentPhase = "english";
        showFloatingWord(item.en, "english");
        lastEnglishWord = item.en;
        spatialBlip(760, 0.65);
        await wait(450);

        await speak(item.en, "en-US", 0.78, 1.08);
        await wait(260);
        await speak(item.es, "es-MX", 0.82, 1.0);
        await wait(800);
        hideFloatingWord();

        if (wordIndex % 5 === 0) {
          triggerMatrix(lastEnglishWord);
        }

        await wait(700);
      }
    }

    function showFloatingWord(text, phase) {
      floatingWord.textContent = text;
      floatingWord.className = "visible";
      if (phase === "english") floatingWord.classList.add("english");
      currentWordVisible = true;
    }

    function hideFloatingWord() {
      floatingWord.className = "";
      currentWordVisible = false;
    }

    function pickVoice(lang) {
      if (!voices.length && window.speechSynthesis) {
        voices = window.speechSynthesis.getVoices();
      }
      const lower = lang.toLowerCase();
      if (lower.startsWith("es")) {
        return voices.find(v => v.lang.toLowerCase().startsWith("es-mx")) ||
               voices.find(v => v.lang.toLowerCase().startsWith("es-us")) ||
               voices.find(v => v.lang.toLowerCase().startsWith("es-es")) ||
               voices.find(v => v.lang.toLowerCase().startsWith("es")) || null;
      }
      return voices.find(v => v.lang.toLowerCase().startsWith("en-us")) ||
             voices.find(v => v.lang.toLowerCase().startsWith("en")) || null;
    }

    function speak(text, lang, rate, pitch) {
      return new Promise(resolve => {
        if (!("speechSynthesis" in window)) {
          setTimeout(resolve, 900);
          return;
        }

        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang;
        utter.rate = rate;
        utter.pitch = pitch;
        utter.volume = 1;
        const voice = pickVoice(lang);
        if (voice) utter.voice = voice;
        utter.onend = resolve;
        utter.onerror = resolve;
        window.speechSynthesis.speak(utter);
      });
    }

    function initAudio() {
      if (audioEngine) return audioEngine;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;

      const ctx = new AudioContextClass();
      const master = ctx.createGain();
      master.gain.value = 0.12;

      const panner = ctx.createPanner();
      panner.panningModel = "HRTF";
      panner.distanceModel = "inverse";
      panner.refDistance = 1;
      panner.maxDistance = 20;
      panner.rolloffFactor = 1.3;
      panner.coneInnerAngle = 360;
      panner.coneOuterAngle = 360;

      master.connect(panner);
      panner.connect(ctx.destination);

      const droneFreqs = [55, 55, 82.4, 41.2];
      droneFreqs.forEach((freq, index) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.value = freq;
        if (index === 1) osc.detune.value = 9;

        gain.gain.value = 0.012;
        lfo.frequency.value = 0.035 + index * 0.013;
        lfoGain.gain.value = 0.006;

        lfo.connect(lfoGain);
        lfoGain.connect(gain.gain);
        osc.connect(gain);
        gain.connect(master);

        osc.start();
        lfo.start();
      });

      audioEngine = { ctx, master, panner };
      schedulePadChord();
      return audioEngine;
    }

    function updateSpatialAudio(position) {
      if (!audioEngine) return;
      const { panner, ctx } = audioEngine;
      const t = ctx.currentTime;

      if (panner.positionX) {
        panner.positionX.linearRampToValueAtTime(position.x, t + 0.025);
        panner.positionY.linearRampToValueAtTime(position.y, t + 0.025);
        panner.positionZ.linearRampToValueAtTime(position.z, t + 0.025);
      } else {
        panner.setPosition(position.x, position.y, position.z);
      }
    }

    function spatialBlip(freq = 660, duration = 0.55) {
      if (!audioEngine) return;
      const { ctx, master } = audioEngine;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.045, ctx.currentTime + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

      osc.connect(gain);
      gain.connect(master);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.03);
    }

    function schedulePadChord() {
      if (!audioEngine) return;
      const { ctx, master } = audioEngine;
      const roots = [130.81, 146.83, 164.81, 196, 220, 261.63];
      const root = roots[Math.floor(Math.random() * roots.length)];
      const duration = THREE.MathUtils.randFloat(6, 9);

      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 680;
      filter.Q.value = 0.7;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.018, ctx.currentTime + 1.5);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + duration);

      [0, 7].forEach(semi => {
        [-7, 8].forEach(detune => {
          const osc = ctx.createOscillator();
          osc.type = "sine";
          osc.frequency.value = root * Math.pow(2, semi / 12);
          osc.detune.value = detune;
          osc.connect(filter);
          osc.start();
          osc.stop(ctx.currentTime + duration + 0.25);
        });
      });

      filter.connect(gain);
      gain.connect(master);
      setTimeout(schedulePadChord, duration * 650);
    }

    function triggerMatrix(word) {
      const ctx = matrixCanvas.getContext("2d");
      let w = matrixCanvas.width = window.innerWidth;
      let h = matrixCanvas.height = window.innerHeight;
      const chars = (word || "VOCAB").replace(/\s/g, "").split("");
      const fontSize = 18;
      let columns = Math.floor(w / fontSize);
      let drops = Array(columns).fill(0).map(() => Math.random() * -30);
      let start = performance.now();
      let frameId;

      matrixCanvas.classList.add("on");

      function draw(now) {
        const age = now - start;
        const fade = Math.max(0, 1 - age / 3500);

        ctx.fillStyle = "rgba(8, 11, 14, 0.12)";
        ctx.fillRect(0, 0, w, h);
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < columns; i++) {
          const letter = chars[Math.floor(Math.random() * chars.length)] || "A";
          ctx.fillStyle = Math.random() > 0.93
            ? `rgba(255,255,255,${fade})`
            : `rgba(122,155,118,${fade * 0.85})`;
          ctx.fillText(letter, i * fontSize, drops[i] * fontSize);
          if (drops[i] * fontSize > h && Math.random() > 0.975) drops[i] = 0;
          drops[i] += 0.78;
        }

        if (age < 3500) {
          frameId = requestAnimationFrame(draw);
        } else {
          matrixCanvas.classList.remove("on");
          cancelAnimationFrame(frameId);
        }
      }

      frameId = requestAnimationFrame(draw);
    }

    window.addEventListener("resize", () => {
      width = window.innerWidth;
      height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
